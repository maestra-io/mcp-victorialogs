name: Lint

on:
  push: { }
  pull_request: { }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          # Resolve the spec against go.dev, not the runner's toolcache: the
          # cache lags a patch release, and govulncheck fails the build on a
          # stdlib CVE the newest patch already fixes (GO-2026-6809, 1.26.9
          # cached while 1.26.10 was out, 22.10.2026).
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

      - name: Run lint
        run: make lint

      - name: Run check
        run: make check

      - name: Run test
        run: make test

      - name: Run build
        run: make build
