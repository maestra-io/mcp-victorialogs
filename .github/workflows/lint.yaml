name: Lint

on:
  push: { }
  pull_request: { }

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version: "1.26"
          # Resolve the spec against go.dev, not the runner's toolcache: the
          # cache lags a patch release, and govulncheck fails the build on a
          # stdlib CVE the newest patch already fixes (GO-2026-6809, 1.26.9
          # cached while 1.26.10 was out, 22.10.2026).
          check-latest: true

      - name: Set up Node.js
        uses: maestra-io/github-actions/setup-node-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # GitHub Releases through nora (packages.maestra.io): 3-day hold, issues-maestra#1649.
      # Bump the version and the sha256 (the release's asset digest) together.
      - name: golangci-lint through nora
        uses: maestra-io/github-actions/nora-asset@bce883a9462ae1a0ec95b02ac797f223589ef7a5 # v1.115.0
        with:
          path: github/golangci/golangci-lint/releases/download/v2.11.4/golangci-lint-2.11.4-linux-amd64.tar.gz
          sha256: 200c5b7503f67b59a6743ccf32133026c174e272b930ee79aa2aa6f37aca7ef1
          bin: golangci-lint
          member: golangci-lint-2.11.4-linux-amd64/golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none

      - name: Run lint
        run: make lint

      - name: Run check
        run: make check

      - name: Run test
        run: make test

      - name: Run build
        run: make build
